name: Check for unwanted files

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check-for-unwanted-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v46

      - name: Check for unwanted files
        run: |
          unwanted_files=""

          while IFS= read -r file; do
            filename=$(basename "$file")

            if [[ "$filename" == ".dev.vars" || "$filename" == ".prod.vars" ]]; then
              unwanted_files="$unwanted_files\n- $file (secrets file - should be gitignored)"
            fi

            if [[ "$filename" == "wrangler.toml" && "$file" != *"wrangler.production.toml" ]]; then
              unwanted_files="$unwanted_files\n- $file (local config - should be gitignored)"
            fi
          done < <(echo '${{ steps.changed-files.outputs.all_changed_files_json }}' | jq -r '.[]')

          if [ -n "$unwanted_files" ]; then
            echo "ERROR: The following unwanted files were found in this PR:"
            echo -e "$unwanted_files"
            exit 1
          else
            echo "No unwanted files found."
          fi
