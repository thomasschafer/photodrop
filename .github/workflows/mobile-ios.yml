name: Build iOS IPA

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - 'VERSION'
      - '.github/workflows/mobile-ios.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'mobile/**'
      - 'frontend/**'
      - 'VERSION'
      - '.github/workflows/mobile-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check signing availability
        id: signing
        env:
          CERT: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$CERT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Apple signing secrets not configured — running simulator build only"
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            mobile/package-lock.json

      - name: Read version
        id: version
        run: |
          VERSION=$(cat VERSION 2>/dev/null || echo "1.0.0")
          BUILD=$(date +%Y%m%d%H%M)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION ($BUILD)"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Substitute Apple Team ID in AASA file for universal links
          if [ -n "$APPLE_TEAM_ID" ]; then
            sed -i "s/TEAM_ID/$APPLE_TEAM_ID/g" public/.well-known/apple-app-site-association
          fi
          npm run build

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: Copy frontend build to mobile
        run: |
          rm -rf mobile/dist
          cp -r frontend/dist mobile/dist

      - name: Sync Capacitor
        working-directory: mobile
        run: npx cap sync ios

      - name: Patch Package.swift with Firebase dependency
        run: |
          # cap sync overwrites Package.swift, removing our Firebase dependency.
          # Patch it back in rather than restoring from git (cap sync adjusts paths).
          PKG=mobile/ios/App/CapApp-SPM/Package.swift

          # Add firebase-ios-sdk to dependencies array (BSD sed on macOS needs -i '')
          sed -i '' '/.package(url: "https:\/\/github.com\/ionic-team\/capacitor-swift-pm.git"/a\
                .package(url: "https://github.com/firebase/firebase-ios-sdk.git", from: "11.0.0"),
          ' "$PKG"

          # Add FirebaseMessaging to target dependencies
          sed -i '' '/.product(name: "Cordova", package: "capacitor-swift-pm")/a\
                        .product(name: "FirebaseMessaging", package: "firebase-ios-sdk"),
          ' "$PKG"

          echo "Patched Package.swift:"
          cat "$PKG"

      - name: Install GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_BASE64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_BASE64" ]; then
            echo -n "$GOOGLE_SERVICE_INFO_BASE64" | base64 --decode > mobile/ios/App/App/GoogleService-Info.plist
            echo "GoogleService-Info.plist installed"
          else
            echo "::warning::IOS_GOOGLE_SERVICE_INFO_BASE64 secret not set — push notifications will not work"
          fi

      - name: Set version in Xcode project
        working-directory: mobile/ios/App
        run: |
          agvtool new-marketing-version "${{ steps.version.outputs.version }}"
          agvtool new-version -all "${{ steps.version.outputs.build }}"

      - name: Install Apple certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          # Create paths
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode from base64
          echo -n "$CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create and configure keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          # Install provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /dev/stdin <<< $(security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "Installed provisioning profile: $PP_UUID"

      - name: Resolve SPM dependencies
        working-directory: mobile/ios/App
        run: |
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App

      # When signing secrets aren't configured, just verify the project compiles
      - name: Verify iOS project compiles (no signing)
        if: steps.signing.outputs.available == 'false'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            build \
            CODE_SIGNING_ALLOWED=NO

      # Signed build + distribution (only when secrets are configured)
      - name: Build iOS archive
        if: steps.signing.outputs.available == 'true'
        working-directory: mobile/ios/App
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="photodrop AppStore" \
            archive

      - name: Export IPA
        if: steps.signing.outputs.available == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed "s/\$(APPLE_TEAM_ID)/$APPLE_TEAM_ID/g" \
            mobile/ios/ExportOptions-appstore.plist > $RUNNER_TEMP/ExportOptions.plist

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Upload IPA artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: photodrop-ios-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30

      - name: Upload to TestFlight
        if: ${{ steps.signing.outputs.available == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

          IPA_PATH=$(find $RUNNER_TEMP/export -name "*.ipa" -print -quit)

          xcrun altool --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Clean up keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
