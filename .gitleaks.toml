title = "photodrop Gitleaks configuration"

[extend]
useDefault = true

[allowlist]
description = "Allowlist for PhotoDrop"
paths = [
  '''\.gitignore$''',
  '''go\.sum$''',
  '''package-lock\.json$''',
]

# False positives: PEM header patterns in code that parses (not stores) private keys
regexes = [
  '''-----BEGIN PRIVATE KEY-----''',
  '''-----END PRIVATE KEY-----''',
]
